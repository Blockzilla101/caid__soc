DESIGN_NAME: fpga_top
VERILOG_INCLUDE_DIRS: "dir::rtl/include"
VERILOG_FILES: "dir::rtl/*/**.v"
CLOCK_PERIOD: 20
CLOCK_PORT: clk
FP_SIZING: "absolute"
DIE_AREA: [0, 0, 800, 800]
PDK: sky130A

VERILOG_DEFINES:
  - ASIC
  - WISHBONE_ENABLE
  - IMEM_LOAD_HEX
  # - IMEM_HEX_PATH "/home/blockzilla/ic-design/projects/caid__soc/tests/gcc/build/wb_fpga_test.mem"

FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10

MACROS:
  sram_1rw1r_32x1024:
    instances:
      wb.wb_data_mem.wb_slave_sram:
        location: [0, 0]
        orientation: "N"
    gds: ["dir::macros/gds/sram_1rw1r_32x1024.gds"]
    lef: ["dir::macros/lef/sram_1rw1r_32x1024.lef"]
    # nl:  ["dir::macros/verilog/sram_1rw1r_32x1024.v"]
    vh:  ["dir::macros/verilog/sram_1rw1r_32x1024_bb.vh"]
    lib: 
      "*":
        - "dir::macros/lib/sram_1rw1r_32x1024_TT_1p8V_25C.lib"
