DESIGN_NAME: asic_top
VERILOG_INCLUDE_DIRS: "dir::rtl/include"
VERILOG_FILES: "dir::rtl/*/**.v"
CLOCK_PERIOD: 100
CLOCK_PORT: clk
FP_SIZING: "absolute"
DIE_AREA: [0, 0, 720.92, 789.76]
PDK: sky130A

VERILOG_DEFINES:
  - ASIC
  - WISHBONE_ENABLE
  - IMEM_LOAD_HEX
  # - IMEM_HEX_PATH "/home/blockzilla/ic-design/projects/caid__soc/tests/gcc/build/wb_fpga_test.mem"

FP_MACRO_HORIZONTAL_HALO: 5
FP_MACRO_VERTICAL_HALO: 5

# ERROR_ON_PDN_VIOLATIONS: false

VDD_NETS: ["vdd"]
GND_NETS: ["vss"]

PL_TARGET_DENSITY_PCT: 0.5

PDN_CONNECT_MACROS_TO_GRID: true
PDN_MACRO_CONNECTIONS:
  - "wb/wb_data_mem/wb_slave_sram vdd vssd1 vdd vss"

# RUN_DRC: false

MACROS:
  sram22_1024x32m8w8:
    instances:
      wb/wb_data_mem/wb_slave_sram:
        location: [253,  10.64]
        orientation: "E"
    gds: ["dir::macros/gds/sram22_1024x32m8w8.gds"]
    lef: ["dir::macros/lef/sram22_1024x32m8w8.lef"]
    # nl:  ["dir::macros/verilog/sram22_1024x32m8w8.v"]
    vh:  ["dir::macros/verilog/sram22_1024x32m8w8_bb.vh"]
    lib: 
      "*":
        - "dir::macros/lib/sram22_1024x32m8w8_ff_n40C_1v95.lib"
        - "dir::macros/lib/sram22_1024x32m8w8_ss_100C_1v60.lib"
        - "dir::macros/lib/sram22_1024x32m8w8_tt_025C_1v80.lib"
